name: smtp
version: "2.0.1"
manifest_version: "1.0.0"
description: "SMTP mail transfer protocol inspector with recipient limits, spam domain blocking, and auth tracking"
author: "RouteWarden Team"
protocols:
  - smtp
  - mail
config:
  max_recipients: 10
  blocked_sender_domains:
    - "*.tempmail.com"
    - "spam.org"
  require_starttls: false
default_service:
  listen: ":2525"
  upstream: "127.0.0.1:25"
  protocol: "smtp"
  rate_limit:
    connections_per_minute: 30
    burst: 10
  max_auth_failures: 3
  ban_after_failures: 3
  ban_duration: "1h"
