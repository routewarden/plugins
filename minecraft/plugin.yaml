name: minecraft
version: "2.0.2"
manifest_version: "1.0.0"
description: Minecraft Java Edition Server List Ping (SLP) & handshake inspector
author: RouteWarden Community
protocols:
  - minecraft
  - mc
config:
  max_connections_per_sec: 10
default_service:
  listen: ":25566"
  upstream: "127.0.0.1:25565"
  protocol: "minecraft"
  rate_limit:
    connections_per_minute: 30
    burst: 5

