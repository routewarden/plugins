name: tls_sni
version: "2.0.0"
manifest_version: "1.0.0"
description: Zero-decryption TLS ClientHello inspector extracting SNI domain names and enforcing domain allow/deny rules
author: RouteWarden Team
protocols:
  - tls
  - sni
config:
  allowed_domains:
    - "*.routewarden.io"
    - "api.internal"
  blocked_domains:
    - "*.malware.example"
default_service:
  listen: ":8443"
  upstream: "127.0.0.1:443"
  protocol: "tls"
  rate_limit:
    connections_per_minute: 120
    burst: 20

