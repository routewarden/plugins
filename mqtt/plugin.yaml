name: mqtt
version: "2.0.0"
manifest_version: "1.0.0"
description: Example custom RouteWarden plugin for IoT MQTT brokers (RFC / OASIS 3.1.1 and 5.0) with ClientID filtering and protocol anomaly detection
author: Community Contributor
protocols:
  - mqtt
config:
  blocked_client_id_prefixes:
    - "bot-"
    - "scanner-"
    - "shodan"
  max_client_id_len: 64
default_service:
  listen: ":1884"
  upstream: "127.0.0.1:1883"
  protocol: "mqtt"
  rate_limit:
    connections_per_minute: 60
    burst: 10

