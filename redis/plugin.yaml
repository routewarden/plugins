name: redis
version: "1.1.0"
manifest_version: "1.0.0"
description: Redis RESP wire protocol inspector with command filtering and credential stuffing detection
author: RouteWarden Team
protocols:
  - redis
config:
  blocked_commands:
    - FLUSHALL
    - FLUSHDB
    - CONFIG
    - SHUTDOWN
    - DEBUG
default_service:
  listen: ":6380"
  upstream: "127.0.0.1:6379"
  protocol: "redis"
  rate_limit:
    connections_per_minute: 120
    burst: 20
  max_auth_failures: 5
  ban_after_failures: 5
  plugin_config:
    blocked_commands:
      - FLUSHALL
      - FLUSHDB
      - CONFIG
      - SHUTDOWN
      - DEBUG

