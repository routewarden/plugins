name: mongodb
version: "1.0.0"
manifest_version: "1.0.0"
description: "MongoDB wire protocol inspector with auth failure detection and op filtering"
author: "RouteWarden Team"
protocols:
  - mongodb
  - mongo
default_service:
  listen: ":27018"
  upstream: "127.0.0.1:27017"
  protocol: "mongodb"
  rate_limit:
    connections_per_minute: 60
    burst: 10

